[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tm-second-brain"
version = "0.1.0a1"
description = "Original, modular, multilingual, agent-agnostic Second Brain and Persistent Memory system."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Taqi Molavi (tmolavi)" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6.0",
]

[project.scripts]
tm-brain = "tm_second_brain.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
